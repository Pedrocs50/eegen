name: Funções do Supabase (testes e publicação)

# Testa as Edge Functions (assistente e áudio) e, num push para a main, publica as duas no Supabase.
# Precisa, uma vez, do segredo SUPABASE_ACCESS_TOKEN no GitHub (docs/assistente-ia.md, "Publicação automática").

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/funcoes.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

env:
  PROJETO: txzjjmufcevisnsvtjwt

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Conferir os tipos
        run: deno check assistente/index.ts audio/index.ts
      - name: Testes (Supabase e Gemini simulados)
        run: deno test testes.ts

  publicar:
    needs: testar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar assistente e áudio
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub (Settings → Secrets and variables → Actions). Veja docs/assistente-ia.md."
            exit 1
          fi
          # --no-verify-jwt: igual ao painel ("Verify JWT with legacy secret" desligado). A própria função confere o
          # login em /auth/v1/user e o papel em eh_equipe; o porteiro antigo recusaria as chaves novas do Supabase.
          for funcao in assistente audio; do
            supabase functions deploy "$funcao" --project-ref "$PROJETO" --no-verify-jwt
          done
